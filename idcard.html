
<html>
    <head>
        <title>
            ID Card
        </title>
        <style>
            .id-card{
                width: 350px;
                height: 220px;
                border: 2px solid #333;
                border-radius: 15px;
                background-color: #f5f5f5;
                font-family: Arial, Arial, Helvetica, sans-serif;
                box-shadow: 0 4px 10px gray;

            }
            .college-name{
                text-align: center;
                font-size: 20px;
                font-weight: bold;
                color: pink;
                margin-top: 10px;
            }
            .student-photo{
                width: 125px;
                height: 150px;
                border: 1px solid #333;
                float: left;
                margin-left: 10px;
                margin-right: 15px;
                object-fit: cover;
                border-radius: 10px;
            }
            .details{
                font-size: 14px;
                line-height: 1.5;
            }
            .details b{
                color: dark pink;
            }
            .group{
                text-align: center;
                font-weight: bold;
                margin-top: 10px;
                color:deeppink;
            }


        </style>
    </head>
    <body>
        <div class="id-card">
            <div class="college-name">
                KL University
            </div>
            <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBSP7JFgvg_ZU90mLOsFv9JWBRqxqCm7XOUHa5JA30yQ&s=10 alt="photo" class="student-photo">
            <div class="details">
                <b>Name</b>:Hasini<br>
         <b>Roll Number</b>:2500030329<br>
         <b>Course</b> :B.Tech<br>
         <b>Department</b>:CSE<br>
         <b>Year</b>:II Year<br>
         <b>Validity</b>:2029
                
            </div>
            <div class="group">
                Blood Group: O<sup>+</sup>
            </div>
        </div>
    </body>
</html>
